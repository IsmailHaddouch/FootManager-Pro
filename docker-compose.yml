services:
  postgres:
    image: postgres:16-alpine
    container_name: footmanager-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-footmanager}
      POSTGRES_USER: ${DB_USER:-footmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-footmanager}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-footmanager} -d ${DB_NAME:-footmanager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
